<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<title>rolldrop — rolldrop.io</title>
<meta name="description" content="Игровые механики, которые превращают разовые касания в постоянную базу прямого контакта.">

<!-- Open Graph / соцсети -->
<meta property="og:type" content="website">
<meta property="og:title" content="rolldrop">
<meta property="og:description" content="Игровые механики, которые превращают разовые касания в постоянную базу прямого контакта.">
<meta property="og:url" content="https://rolldrop.io">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --rich-black: #0f0f10;
    --pear: #d3fb37;
    --cream: #f5eedc;          /* подзаголовок */
    --domain: rgba(255,255,255,0.85);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--rich-black);
    color: #fff;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    /* Полноэкранный герой по центру при любой высоте экрана */
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* безопасные отступы + поля для маленьких экранов */
    padding:
      max(24px, env(safe-area-inset-top))
      clamp(20px, 6vw, 96px)
      max(24px, env(safe-area-inset-bottom))
      clamp(20px, 6vw, 96px);
  }

  .hero {
    width: 100%;
    max-width: 1120px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* rolldrop» — Bold 120px @1920 → масштабируется по ширине вьюпорта */
  .wordmark {
    font-weight: 700;
    font-size: clamp(52px, 12.5vw, 120px);
    line-height: 1.0;
    letter-spacing: -0.02em;
    color: var(--pear);
  }
  .wordmark .d { color: #fff; }
  /* угловая скобка чуть тоньше визуально не трогаем — оставляем как в макете */

  /* rolldrop.io — Medium 28px */
  .domain {
    margin-top: clamp(10px, 1.6vw, 18px);
    font-weight: 500;
    font-size: clamp(15px, 2.2vw, 28px);
    letter-spacing: 0.07em;
    color: var(--domain);
  }

  /* Подзаголовок — Regular 32px, line-height 1.35, max-width 1117px */
  .subtitle {
    margin-top: clamp(28px, 4.8vw, 62px);
    max-width: 1117px;
    font-weight: 400;
    font-size: clamp(17px, 2.5vw, 32px);
    line-height: 1.35;
    color: var(--cream);
    text-wrap: balance;
  }

  /* SECTION 228 · PRE-SEED · 2026 — Medium 14px, tracking 1.96px */
  .eyebrow {
    margin-top: clamp(26px, 4.6vw, 56px);
    font-weight: 500;
    font-size: clamp(11px, 1.4vw, 14px);
    letter-spacing: 0.14em;
    color: var(--pear);
    white-space: nowrap;
  }

  /* Очень узкие экраны — даём подзаголовку дышать */
  @media (max-width: 380px) {
    .subtitle { font-size: 16px; }
    .eyebrow { letter-spacing: 0.1em; }
  }

  /* Альбомная ориентация на телефоне (низкая высота) — поджимаем вертикальные отступы */
  @media (max-height: 480px) and (orientation: landscape) {
    .wordmark { font-size: clamp(40px, 9vw, 88px); }
    .subtitle { margin-top: clamp(16px, 3vw, 28px); }
    .eyebrow  { margin-top: clamp(14px, 2.6vw, 24px); }
  }
</style>
</head>
<body>
  <main class="hero">
    <h1 class="wordmark">roll<span class="d">d</span>rop&raquo;</h1>
    <p class="domain">rolldrop.io</p>
    <p class="subtitle">Игровые механики, которые превращают разовые касания в&nbsp;постоянную базу прямого контакта.</p>
    <p class="eyebrow">SECTION 228 · PRE-SEED · 2026</p>
  </main>
</body>
</html>
