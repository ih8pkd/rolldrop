<style>
  :root {
    --rich-black: #0f0f10;
    --pear: #d3fb37;
    --cream: #f5eedc;          /* подзаголовок */
    --domain: rgba(255,255,255,0.85);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow-x: hidden; }

  body {
    background: var(--rich-black);
    color: #fff;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    /* Полноэкранный герой по центру при любой высоте экрана */
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* безопасные отступы + поля для маленьких экранов */
    padding:
      max(24px, env(safe-area-inset-top))
      clamp(20px, 6vw, 96px)
      max(24px, env(safe-area-inset-bottom))
      clamp(20px, 6vw, 96px);
  }

  .hero {
    width: 100%;
    max-width: 1120px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  /* rolldrop» — Bold 120px @1920 → масштабируется по ширине вьюпорта */
  .wordmark {
    font-weight: 700;
    font-size: clamp(52px, 12.5vw, 120px);
    line-height: 1.0;
    letter-spacing: -0.02em;
    color: var(--pear);
  }
  .wordmark .d { color: #fff; }
  /* «»» разбит на два одинарных шеврона; правый — белый акцент */
  .wordmark .chev { letter-spacing: -0.12em; }
  .wordmark .chev-w { color: #fff; }
  /* угловая скобка чуть тоньше визуально не трогаем — оставляем как в макете */

  /* rolldrop.io — Medium 28px */
  .domain {
    margin-top: clamp(10px, 1.6vw, 18px);
    font-weight: 500;
    font-size: clamp(15px, 2.2vw, 28px);
    letter-spacing: 0.07em;
    color: var(--domain);
  }

  /* Подзаголовок — Regular 32px, line-height 1.35, max-width 1117px */
  .subtitle {
    margin-top: clamp(28px, 4.8vw, 62px);
    max-width: 1117px;
    font-weight: 400;
    font-size: clamp(17px, 2.5vw, 32px);
    line-height: 1.35;
    color: var(--cream);
    text-wrap: balance;
  }

  /* SECTION 228 · PRE-SEED · 2026 — Medium 14px, tracking 1.96px */
  .eyebrow {
    margin-top: clamp(26px, 4.6vw, 56px);
    font-weight: 500;
    font-size: clamp(11px, 1.4vw, 14px);
    letter-spacing: 0.14em;
    color: var(--pear);
    white-space: nowrap;
  }

  /* Очень узкие экраны — даём подзаголовку дышать */
  @media (max-width: 380px) {
    .subtitle { font-size: 16px; }
    .eyebrow { letter-spacing: 0.1em; }
  }

  /* Альбомная ориентация на телефоне (низкая высота) — поджимаем вертикальные отступы */
  @media (max-height: 480px) and (orientation: landscape) {
    .wordmark { font-size: clamp(40px, 9vw, 88px); }
    .subtitle { margin-top: clamp(16px, 3vw, 28px); }
    .eyebrow  { margin-top: clamp(14px, 2.6vw, 24px); }
  }

  /* ===== QR «for investors» (правый нижний угол) ===== */
  .qr-chip {
    position: fixed;
    right: clamp(16px, 3vw, 40px);
    bottom: clamp(16px, 3vw, 40px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    z-index: 10;
  }
  .qr-label {
    font-weight: 500;
    font-size: clamp(9px, 1vw, 11px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--pear);
  }
  .qr-img {
    width: clamp(76px, 9vw, 116px);
    height: auto;
    display: block;
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 6px 28px rgba(0,0,0,.45);
    transition: transform .2s ease;
  }
  .qr-chip:hover .qr-img { transform: translateY(-2px); }

  /* на маленьких экранах — компактнее, чтобы не наезжал на текст */
  @media (max-width: 600px) {
    .qr-chip { right: 14px; bottom: 14px; gap: 6px; }
    .qr-img  { width: 64px; border-radius: 8px; }
    .qr-label { font-size: 9px; letter-spacing: 0.14em; }
  }

  /* ===== Эффекты «Тихий премиум» ===== */
  /* 1. Мягкое салатовое свечение за словом */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(42vw 42vw at 50% 43%, rgba(211,251,55,.13), rgba(211,251,55,.04) 45%, transparent 72%);
    pointer-events: none;
    z-index: 0;
  }

  /* 2. Блик пробегает по слову один раз при загрузке */
  .wordmark { position: relative; }
  @media (prefers-reduced-motion: no-preference) {
    .wordmark::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.40) 50%, transparent 62%);
      background-size: 250% 100%;
      background-position: 180% 0;
      animation: sheen 1.5s cubic-bezier(.4, 0, .2, 1) .5s 1 forwards;
      mix-blend-mode: screen;
      pointer-events: none;
    }
  }
  @keyframes sheen { to { background-position: -120% 0; } }

  /* 3. Плавное появление текста снизу вверх */
  @media (prefers-reduced-motion: no-preference) {
    .wordmark, .domain, .subtitle, .eyebrow, .qr-chip {
      opacity: 0;
      animation: fadeup .7s ease forwards;
    }
    .wordmark { animation-delay: .05s; }
    .domain   { animation-delay: .18s; }
    .subtitle { animation-delay: .30s; }
    .eyebrow  { animation-delay: .42s; }
    .qr-chip  { animation-delay: .60s; }
  }
  @keyframes fadeup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
</style>
